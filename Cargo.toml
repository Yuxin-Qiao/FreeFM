[package]
name = "freefm"
version = "0.1.0"
edition = "2024"
description = "A native Rust CLI that mirrors free-playable NetEase Cloud Music Private FM songs into an append-only playlist"
license = "MIT"
repository = "https://github.com/Yuxin-Qiao/freefm"

[dependencies]
libc = "0.2"
netease-music = "=0.1.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
