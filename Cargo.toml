[package]
name = "freefm"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Native Rust CLI and TUI for safely syncing free-playable NetEase Private FM tracks"
license = "MIT"
repository = "https://github.com/Yuxin-Qiao/FreeFM"
homepage = "https://github.com/Yuxin-Qiao/FreeFM"
readme = "README.md"
keywords = ["netease", "private-fm", "playlist", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
libc = "0.2"
netease-music = "=0.1.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
