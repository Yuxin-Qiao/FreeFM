name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    env:
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve pull request metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          import uuid

          with open(sys.argv[1], encoding="utf-8") as handle:
              pull_request = json.load(handle)
          output_path = sys.argv[2]
          delimiter = f"ghadelim_{uuid.uuid4().hex}"
          values = {
              "number": str(pull_request["number"]),
              "base_sha": pull_request["base"]["sha"],
              "head_sha": pull_request["head"]["sha"],
              "title": pull_request.get("title") or "",
              "body": pull_request.get("body") or "",
          }
          with open(output_path, "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Run AI verification
        id: ai
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_ENDPOINT: ${{ secrets.AI_REVIEW_ENDPOINT }}
          AI_REVIEW_MODEL: ${{ secrets.AI_REVIEW_MODEL }}
        run: |
          set -uo pipefail
          set +e
          collect_status=0
          gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" > "$RUNNER_TEMP/pr.diff" || collect_status=2
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/pr.files" || collect_status=2
          if [ "${collect_status}" -ne 0 ]; then
            echo "AI verification skipped: unable to collect PR data; failing open" >&2
            echo "ai_status=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ai-review.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --diff-file "$RUNNER_TEMP/pr.diff" \
            --files-file "$RUNNER_TEMP/pr.files" \
            --pr-number "$PR_NUMBER" \
            --output ai-review.md
          status=$?
          set -e
          echo "ai_status=${status}" >> "$GITHUB_OUTPUT"
          # Exit 1 blocks the merge (fail closed). Exit 2 is an
          # infrastructure failure: fail open so transient model
          # endpoint problems do not stall every PR.
          if [ "${status}" -eq 2 ]; then
            exit 0
          fi
          exit "${status}"

      - name: Post AI review comment
        if: always() && steps.ai.outputs.ai_status != '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$REPOSITORY" --comment --body-file ai-review.md

      - name: Comment infrastructure skip
        if: always() && steps.ai.outputs.ai_status == '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "AI verification was skipped because the model endpoint was unavailable (fail-open). This does not block the merge; see the job log for details."

      - name: Upload AI review report
        if: always() && steps.ai.outputs.ai_status != '2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review
          path: ai-review.md
          if-no-files-found: error
