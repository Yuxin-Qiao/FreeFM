name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release --locked
      - name: Package native binary
        shell: bash
        run: |
          set -euo pipefail
          platform=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          name="freefm-${GITHUB_REF_NAME}-${platform}-${arch}"
          mkdir -p "dist/${name}"
          cp target/release/freefm "dist/${name}/freefm"
          cp README.md README.zh-CN.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          fi
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: freefm-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  workbuddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package WorkBuddy skill
        run: scripts/package-workbuddy.sh dist/freefm-workbuddy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: freefm-workbuddy
          path: dist/freefm-workbuddy.zip
          if-no-files-found: error

  publish:
    needs: [binary, workbuddy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "FreeFM ${GITHUB_REF_NAME}"
