name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binary:
    needs: security
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - runner: macos-latest
            platform: darwin
            arch: arm64
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Package native binary
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          name="freefm-${GITHUB_REF_NAME}-${platform}-${arch}"
          mkdir -p "dist/${name}"
          cp target/release/freefm "dist/${name}/freefm"
          cp README.md README.zh-CN.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          fi
          rm -rf "dist/${name}"
      - name: Attest binary and checksum
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freefm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  workbuddy:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package WorkBuddy skill
        run: scripts/package-workbuddy.sh dist/freefm-workbuddy.zip
      - name: Attest WorkBuddy package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/freefm-workbuddy.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freefm-workbuddy
          path: dist/freefm-workbuddy.zip
          if-no-files-found: error

  sbom:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: freefm-sbom.cdx.json
          artifact-name: freefm-sbom

  publish:
    environment: release
    permissions:
      contents: write
    needs: [binary, workbuddy, sbom, security, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "FreeFM ${GITHUB_REF_NAME}"

  security:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Download pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
      - name: Scan for credentials
        run: /tmp/gitleaks dir --no-banner --redact --timeout 300 .

  smoke:
    needs: security
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: scripts/release-smoke-test.sh
