name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Validate marketplace skill
        run: |
          grep -q '^name: freefm$' SKILL.md
          grep -q '^name: freefm$' skills/freefm/SKILL.md
          grep -q '^description:' skills/freefm/SKILL.md
          grep -q '^---$' skills/freefm/SKILL.md
          grep -q 'Codex' skills/freefm/SKILL.md
          test -f automation/codex/README.md
          for icon in openclaw.svg hermes.png workbuddy.png codex.svg; do
            test -f "assets/platforms/$icon"
          done
          cmp automation/hermes/freefm-sync.sh skills/freefm/scripts/freefm-sync.sh
          sh -n skills/freefm/scripts/freefm-sync.sh
          sh -n scripts/package-workbuddy.sh
          sh -n scripts/install.sh
          scripts/release-smoke-test.sh
          python3 -m json.tool skills.sh.json >/dev/null

  # Minimum supported Rust version: verified with the same fake-transport,
  # fixture-only test suite. Bump rust-version in Cargo.toml together with this
  # job if a dependency raises its own MSRV.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
      - run: cargo check --all-targets --locked

  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
