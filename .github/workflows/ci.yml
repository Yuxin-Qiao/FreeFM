name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Validate marketplace skill
        run: |
          grep -q '^name: freefm$' SKILL.md
          grep -q '^name: freefm$' skills/freefm/SKILL.md
          grep -q '^description:' skills/freefm/SKILL.md
          cmp automation/hermes/freefm-sync.sh skills/freefm/scripts/freefm-sync.sh
          sh -n skills/freefm/scripts/freefm-sync.sh
          sh -n scripts/package-workbuddy.sh
          scripts/package-workbuddy.sh target/freefm-workbuddy.zip
          unzip -l target/freefm-workbuddy.zip | grep -q 'freefm/SKILL.md'
          unzip -l target/freefm-workbuddy.zip | grep -q 'freefm/scripts/freefm-sync.sh'
          python3 -m json.tool skills.sh.json >/dev/null

  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
