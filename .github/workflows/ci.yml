name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Validate marketplace skill
        run: |
          grep -q '^name: freefm$' SKILL.md
          grep -q '^name: freefm$' skills/freefm/SKILL.md
          grep -q '^description:' skills/freefm/SKILL.md
          grep -q '^---$' skills/freefm/SKILL.md
          grep -q 'Codex' skills/freefm/SKILL.md
          test -f automation/codex/README.md
          for icon in openclaw.svg hermes.png workbuddy.png codex.svg; do
            test -f "assets/platforms/$icon"
          done
          cmp automation/hermes/freefm-sync.sh skills/freefm/scripts/freefm-sync.sh
          cmp automation/hermes/freefm-audit.sh skills/freefm/scripts/freefm-audit.sh
          sh -n skills/freefm/scripts/freefm-sync.sh
          sh -n skills/freefm/scripts/freefm-audit.sh
          sh -n scripts/package-workbuddy.sh
          sh -n scripts/install.sh
          scripts/release-smoke-test.sh
          python3 -m json.tool skills.sh.json >/dev/null

  # Minimum supported Rust version: verified with the same fake-transport,
  # fixture-only test suite. Bump rust-version in Cargo.toml together with this
  # job if a dependency raises its own MSRV.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
      - run: cargo check --all-targets --locked

  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  # Credential scan: same gitleaks release and invocation as the local
  # release-closeout gate, pinned by version and SHA-256 so CI never fetches a
  # moving artifact. Scans the working tree only; no live services involved.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
      - name: Scan for credentials
        run: /tmp/gitleaks dir --no-banner --redact --timeout 300 .

  # Repository-hygiene gate: every action ref must stay pinned to a full commit
  # SHA (scripts/pin-actions.sh), every shell script must stay syntactically
  # valid, and the launchd plist must parse.
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Workflow refs pinned
        run: scripts/pin-actions.sh --check
      - name: Shell syntax and launchd plist
        run: |
          for f in scripts/*.sh automation/hermes/*.sh automation/launchd/*.sh skills/freefm/scripts/*.sh; do
            sh -n "$f"
          done
          python3 -c "import plistlib; plistlib.load(open('automation/launchd/com.freefm.validation.plist','rb'))"
