<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">FreeFM product overview</title>
  <desc id="desc">A dark gradient FreeFM banner showing Private FM flowing into a safe append-only playlist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#17142b"/>
      <stop offset="1" stop-color="#092a2c"/>
    </linearGradient>
    <radialGradient id="orange" cx="0" cy="0" r="1" gradientTransform="translate(260 100) rotate(35) scale(560 350)">
      <stop stop-color="#ff7a45" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(1160 470) rotate(-145) scale(540 330)">
      <stop stop-color="#10c7b4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#10c7b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1440" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="32" fill="url(#orange)"/>
  <rect width="1440" height="560" rx="32" fill="url(#cyan)"/>
  <rect width="1440" height="560" rx="32" fill="url(#grid)"/>

  <g transform="translate(92 82)">
    <rect width="68" height="68" rx="18" fill="#0a0d16" stroke="#fff" stroke-opacity=".12"/>
    <path d="M15 36h8l5-18 9 34 7-27 5 11h8" fill="none" stroke="#17d6c3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="150" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="750">FreeFM</text>
    <text x="2" y="200" fill="#cbd2df" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">Private FM in. A clean playlist out.</text>
    <text x="2" y="246" fill="#8f9aad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Private FM  &gt;  strict free proof  &gt;  FreeFM · Auto</text>

    <g transform="translate(0 304)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">
      <rect width="142" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".1"/>
      <text x="22" y="27" fill="#f4f6fb">Rust native</text>
      <rect x="154" width="154" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".1"/>
      <text x="176" y="27" fill="#f4f6fb">append-only</text>
      <rect x="320" width="138" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".1"/>
      <text x="342" y="27" fill="#f4f6fb">zero idle</text>
    </g>
  </g>

  <g transform="translate(800 62)">
    <rect width="548" height="436" rx="26" fill="#090c13" fill-opacity=".92" stroke="#fff" stroke-opacity=".11"/>
    <circle cx="30" cy="28" r="6" fill="#ff6b62"/>
    <circle cx="50" cy="28" r="6" fill="#ffbd45"/>
    <circle cx="70" cy="28" r="6" fill="#28c940"/>
    <text x="28" y="79" fill="#f5f7fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">FreeFM · Auto</text>
    <text x="397" y="79" fill="#758096" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">append-only</text>
    <path d="M28 102H520" stroke="#fff" stroke-opacity=".09"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <g transform="translate(28 130)">
        <rect width="492" height="66" rx="13" fill="#fff" fill-opacity=".045"/>
        <circle cx="28" cy="33" r="14" fill="#ff7a45" fill-opacity=".92"/>
        <path d="M24 25v18l12-9z" fill="#fff"/>
        <text x="56" y="29" fill="#eef2f8" font-size="16">Private FM original</text>
        <text x="56" y="50" fill="#7f8a9d" font-size="13">fee 0 · playable · no trial</text>
        <rect x="407" y="19" width="62" height="28" rx="14" fill="#0eb7a4" fill-opacity=".18"/>
        <text x="421" y="38" fill="#32ddc8" font-size="12" font-weight="700">FREE</text>
      </g>
      <g transform="translate(28 210)">
        <rect width="492" height="66" rx="13" fill="#fff" fill-opacity=".045"/>
        <circle cx="28" cy="33" r="14" fill="#7e8798" fill-opacity=".45"/>
        <path d="M24 25v18l12-9z" fill="#c7ced9"/>
        <text x="56" y="29" fill="#eef2f8" font-size="16">Restricted recommendation</text>
        <text x="56" y="50" fill="#7f8a9d" font-size="13">candidate shown · never substituted</text>
        <rect x="407" y="19" width="62" height="28" rx="14" fill="#ffbd45" fill-opacity=".14"/>
        <text x="421" y="38" fill="#ffd36d" font-size="12" font-weight="700">SKIP</text>
      </g>
      <g transform="translate(28 290)">
        <rect width="492" height="66" rx="13" fill="#fff" fill-opacity=".045"/>
        <circle cx="28" cy="33" r="14" fill="#5e6a7f" fill-opacity=".45"/>
        <path d="M24 25v18l12-9z" fill="#c7ced9"/>
        <text x="56" y="29" fill="#eef2f8" font-size="16">Unknown availability</text>
        <text x="56" y="50" fill="#7f8a9d" font-size="13">missing evidence · fail closed</text>
        <rect x="407" y="19" width="62" height="28" rx="14" fill="#ffbd45" fill-opacity=".14"/>
        <text x="421" y="38" fill="#ffd36d" font-size="12" font-weight="700">SKIP</text>
      </g>
    </g>

    <text x="28" y="400" fill="#17d6c3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">verified · deduplicated · saved locally</text>
  </g>
</svg>
